version: '3'

services:
  ai-service:
    container_name: ai-service
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    environment:
      - MINIO_ENDPOINT=dev-minio.leamech.com
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECURE=true
      - MINIO_SECRET_KEY=mIn!0#2023_S3cureKey
      - REDIS_HOST=dev-valkey.leamech.com
      # - REDIS_PASSWORD=v@lk3y#2023_C@che!
      - REDIS_PORT=6379
      - MONGO_DB=negar-db
      - MONGO_USERNAME=mongo
      - MONGO_PASSWORD=m0ng0#2023_Dev!
      - MONGO_HOST=dev-mongodb.leamech.com
      - MONGO_PORT=27017
    volumes:
      - ./ai-service:/app
      - ./utils:/app/utils
    networks:
      - app-network

  frame-service:
    container_name: frame-service
    build:
      context: .
      dockerfile: ./frame-service/Dockerfile
    ports:
      - "5004:5004"
    environment:
      - REDIS_HOST=dev-valkey.leamech.com
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=dev-minio.leamech.com
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECURE=true
      - MINIO_SECRET_KEY=mIn!0#2023_S3cureKey
      - MONGO_DB=negar-db
      - MONGO_USERNAME=mongo
      - MONGO_PASSWORD=m0ng0#2023_Dev!
      - MONGO_HOST=dev-mongodb.leamech.com
      - MONGO_PORT=27017
      # - REDIS_PASSWORD=v@lk3y#2023_C@che!
    volumes:
      - ./frame-service:/app
      - ./utils:/app/utils
    networks:
      - app-network
  
  mapping-service:
    container_name: mapping-service
    build:
      context: .
      dockerfile: ./mapping-service/Dockerfile
    environment:
      - REDIS_HOST=dev-valkey.leamech.com
      - REDIS_PORT=6379
      # - REDIS_PASSWORD=v@lk3y#2023_C@che!
      - MONGO_DB=negar-db
      - MONGO_USERNAME=mongo
      - MONGO_PASSWORD=m0ng0#2023_Dev!
      - MONGO_HOST=dev-mongodb.leamech.com
      - MONGO_PORT=27017
    volumes:
      - ./mapping-service:/app
      - ./utils:/app/utils
    ports:
      - "5005:5005"
    networks:
      - app-network

  valkey-service:
    container_name: valkey-service
    image: valkey/valkey:latest
    command: ["valkey-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--protected-mode", "no", "--replicaof", "no", "one"]
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=v@lk3y#2023_C@che!
    networks:
      - app-network
    volumes:
      - valkey-data:/data
      
      

networks:
  app-network:
    driver: bridge

volumes:
  valkey-data: