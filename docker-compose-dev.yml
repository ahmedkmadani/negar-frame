version: '3'

services:
  ai-service:
    container_name: ai-service
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    environment:
      - MINIO_ENDPOINT=dev-minio.leamech.com
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=mIn!0#2023_S3cureKey
      - REDIS_HOST=dev-valkey
      - MINIO_SECURE=true
      - REDIS_PASSWORD=v@lk3y#2023_C@che!
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Required for Linux
    volumes:
      - ./ai-service:/app
      - ./utils:/app/utils
    networks:
      - app-network
      - dev-network

  frame-service:
    container_name: frame-service
    build:
      context: .
      dockerfile: ./frame-service/Dockerfile
    ports:
      - "5004:5004"
    environment:
      - REDIS_HOST=dev-valkey
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=dev-minio.leamech.com
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECURE=true
      - MINIO_SECRET_KEY=mIn!0#2023_S3cureKey
      - REDIS_PASSWORD=v@lk3y#2023_C@che!
    volumes:
      - ./frame-service:/app
      - ./utils:/app/utils
    networks:
      - app-network
      - dev-network

networks:
  app-network:
    driver: bridge
  dev-network:
    external: true
